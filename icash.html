<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iCash — Bank Without Your Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#070d14; --bg2:#0c111a; --panel:#0f1620; --panel2:#131c28;
  --glass:rgba(255,255,255,0.045); --glass-hi:rgba(255,255,255,0.08);
  --border:rgba(140,180,220,0.14); --border-hi:rgba(140,200,240,0.28);
  --accent:#4fd1ff; --accent2:#38e6c4; --accent-dim:#2a7a94;
  --warn:#f2b84b; --danger:#ff5c7a; --success:#38e6a8;
  --text:#e9f1fa; --muted:#8ea3bd; --muted2:#5f7590;
  --radius:18px; --radius-sm:10px;
  --font-d:'Space Grotesk',sans-serif; --font-b:'Inter',sans-serif;
}
[data-senior="1"]{ --scale:1.18; }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:radial-gradient(1200px 700px at 80% -10%, #0d2230 0%, var(--bg) 55%), var(--bg);
  color:var(--text); font-family:var(--font-b); min-height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent); color:#001018;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; color:inherit; background:none;}
select{color:inherit; font:inherit;}
img,svg{max-width:100%;}
.wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
@media(max-width:720px){.wrap{padding:0 18px;}}

/* ---------- NAV ---------- */
.topnav{position:sticky; top:0; z-index:50; top:env(safe-area-inset-top,0px);
  background:rgba(8,11,17,0.72); backdrop-filter:blur(16px); border-bottom:1px solid var(--border);}
.topnav .row{display:flex; align-items:center; justify-content:space-between; height:64px;}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-d); font-weight:700; font-size:20px; letter-spacing:0.2px;}
.brand .mark{width:26px; height:26px; border-radius:8px; background:conic-gradient(from 200deg, var(--accent), var(--accent2), var(--accent)); display:grid; place-items:center; box-shadow:0 0 18px rgba(79,209,255,0.5);}
.brand .mark::after{content:''; width:9px; height:9px; border-radius:50%; background:var(--bg); }
.navlinks{display:flex; gap:26px; align-items:center;}
.navlinks a{color:var(--muted); font-size:14.5px; transition:color .2s;}
.navlinks a:hover, .navlinks a.active{color:var(--text);}
.navcta{display:flex; gap:10px;}
.hamb{display:none; background:none; border:none; color:var(--text); font-size:22px;}
@media(max-width:860px){ .navlinks{display:none;} .navcta{display:none;} .hamb{display:block;} }

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:100px; border:1px solid transparent; font-size:14.5px; font-weight:600; transition:transform .15s, box-shadow .2s, background .2s, border-color .2s; white-space:nowrap;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#00131a; box-shadow:0 6px 24px rgba(56,230,196,0.22);}
.btn-primary:hover{box-shadow:0 8px 30px rgba(56,230,196,0.35);}
.btn-ghost{background:var(--glass); color:var(--text); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--border-hi); background:var(--glass-hi);}
.btn-outline{background:transparent; border-color:var(--border-hi); color:var(--text);}
.btn-danger{background:linear-gradient(135deg,#ff5c7a,#d63a5c); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px; font-size:13px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}

/* ---------- GLASS / CARD ---------- */
.glass{background:var(--glass); border:1px solid var(--border); border-radius:var(--radius); backdrop-filter:blur(14px);}
.card{background:linear-gradient(160deg, var(--panel2), var(--panel)); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:100px; font-size:12px; font-weight:600; background:var(--glass); border:1px solid var(--border); color:var(--muted);}
.pill.ok{color:var(--success); border-color:rgba(56,230,168,0.3); background:rgba(56,230,168,0.08);}
.pill.warn{color:var(--warn); border-color:rgba(242,184,75,0.3); background:rgba(242,184,75,0.08);}
.pill.danger{color:var(--danger); border-color:rgba(255,92,122,0.3); background:rgba(255,92,122,0.08);}

/* ---------- HERO ---------- */
.hero{position:relative; padding:76px 0 60px; overflow:hidden;}
.hero-grid{display:grid; grid-template-columns:1.05fr 0.95fr; gap:40px; align-items:center;}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;}}
.eyebrow{color:var(--accent); font-size:13px; font-weight:600; letter-spacing:.4px; display:flex; align-items:center; gap:8px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent); box-shadow:0 0 10px var(--accent); animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.3}}
h1.display{font-family:var(--font-d); font-weight:700; font-size:clamp(38px,5.4vw,60px); line-height:1.04; letter-spacing:-1px; margin:16px 0 18px;}
h1.display .grad{background:linear-gradient(100deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.lede{color:var(--muted); font-size:17px; line-height:1.65; max-width:480px; margin-bottom:30px;}
.hero-cta{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:34px;}
.hero-visual{position:relative; height:420px;}
#heroCanvas{width:100%; height:100%; display:block;}
.scan-caption{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); text-align:center; font-family:var(--font-d); font-size:13px; letter-spacing:2px; color:var(--accent);}
.scan-caption .sub{display:block; color:var(--muted2); font-size:11px; letter-spacing:3px; margin-top:4px;}

/* ---------- STEPS ---------- */
.section{padding:64px 0;}
.section-head{max-width:560px; margin-bottom:36px;}
.section-head h2{font-family:var(--font-d); font-size:clamp(26px,3.4vw,36px); font-weight:700; letter-spacing:-0.5px; margin-bottom:10px;}
.section-head p{color:var(--muted); font-size:15.5px; line-height:1.6;}
.steps4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
@media(max-width:820px){.steps4{grid-template-columns:1fr 1fr;}}
@media(max-width:500px){.steps4{grid-template-columns:1fr;}}
.step-card{padding:22px; position:relative;}
.step-num{font-family:var(--font-d); font-size:28px; color:var(--accent-dim); font-weight:700; margin-bottom:14px;}
.step-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,rgba(79,209,255,.18),rgba(56,230,196,.1)); border:1px solid var(--border); display:grid; place-items:center; margin-bottom:14px;}
.step-card h3{font-family:var(--font-d); font-size:17px; margin-bottom:6px;}
.step-card p{color:var(--muted); font-size:13.5px; line-height:1.5;}

/* Feature strip */
.feat-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media(max-width:760px){.feat-strip{grid-template-columns:1fr;}}
.feat{padding:24px;}
.feat h4{font-family:var(--font-d); font-size:16px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.feat p{color:var(--muted); font-size:13.5px; line-height:1.55;}

footer{border-top:1px solid var(--border); padding:34px 0; color:var(--muted2); font-size:13px;}
footer .fr{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}

/* ---------- AUTH / WIZARD ---------- */
.auth-shell{min-height:calc(100vh - 64px); display:flex; align-items:center; justify-content:center; padding:40px 18px;}
.auth-card{width:100%; max-width:460px; padding:34px;}
.auth-card.wide{max-width:640px;}
.auth-head{text-align:center; margin-bottom:26px;}
.auth-head h2{font-family:var(--font-d); font-size:24px; margin-bottom:6px;}
.auth-head p{color:var(--muted); font-size:13.5px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; font-weight:600;}
.field input, .field select{width:100%; padding:12px 14px; border-radius:var(--radius-sm); background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--text); font-size:14.5px; font-family:inherit; transition:border-color .2s;}
.field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
.field select option{background:#101823; color:#e9f1fa;}
.field .err{color:var(--danger); font-size:12px; margin-top:5px; display:none;}
.field.invalid input{border-color:var(--danger);}
.field.invalid .err{display:block;}
.field .hint{color:var(--muted2); font-size:11.5px; margin-top:5px;}
.pin-wrap{position:relative;}
.pin-toggle{position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); font-size:12px;}
.strength{height:4px; border-radius:4px; background:var(--glass); margin-top:8px; overflow:hidden;}
.strength i{display:block; height:100%; width:0%; background:var(--danger); transition:width .25s, background .25s;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:480px){.row2{grid-template-columns:1fr;}}

.wizard-progress{display:flex; gap:6px; margin-bottom:26px;}
.wizard-progress i{flex:1; height:3px; border-radius:3px; background:var(--glass);}
.wizard-progress i.done{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.wizard-progress i.active{background:var(--accent-dim);}
.wizard-footer{display:flex; justify-content:space-between; gap:10px; margin-top:22px;}

.classify-badge{display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--radius-sm); background:rgba(79,209,255,0.06); border:1px solid var(--border); margin:6px 0 18px; font-size:13px; color:var(--muted);}
.classify-badge b{color:var(--text);}

/* ---------- FACE SCANNER ---------- */
.scanner{position:relative; width:230px; height:230px; margin:0 auto 20px; border-radius:50%; overflow:hidden; background:#000; border:2px solid var(--border);}
.scanner.senior{width:280px; height:280px;}
.scanner video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1);}
.scanner .ring{position:absolute; inset:-2px; border-radius:50%; border:3px solid transparent; border-top-color:var(--accent); border-right-color:var(--accent2); animation:spin 2.2s linear infinite; pointer-events:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.scanner .frame{position:absolute; inset:14px; border-radius:50%; border:1.5px dashed rgba(255,255,255,0.35); pointer-events:none;}
.eye-track{position:absolute; left:20%; right:20%; top:30%; height:14%; pointer-events:none;}
.eye-track .eye-dot{position:absolute; top:50%; width:18%; height:60%; transform:translateY(-50%); border:1.5px solid rgba(79,209,255,0.75); border-radius:50%; box-shadow:0 0 8px rgba(79,209,255,0.4);}
.eye-track .eye-dot.left{left:6%;} .eye-track .eye-dot.right{right:6%;}
.scanner .flash{position:absolute; inset:0; background:var(--success); opacity:0; transition:opacity .3s;}
.scanner .flash.on{opacity:.35;}
.scan-status{text-align:center; font-family:var(--font-d); font-size:14px; letter-spacing:.5px; color:var(--accent); min-height:20px; margin-bottom:14px;}
.scan-checks{display:grid; gap:8px; margin-bottom:18px;}
.scan-check{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted2); transition:color .2s;}
.scan-check .dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--muted2); display:grid; place-items:center; font-size:10px; flex-shrink:0; transition:.2s;}
.scan-check.on{color:var(--text);}
.scan-check.on .dot{background:var(--success); border-color:var(--success); color:#00170f;}
.demo-tag{text-align:center; font-size:10.5px; letter-spacing:1.5px; color:var(--muted2); text-transform:uppercase; margin-top:4px;}

/* ---------- APP SHELL / DASHBOARD ---------- */
.app-shell{min-height:calc(100vh - 64px); padding:28px 0 60px;}
.dash-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:20px;}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}
.balance-card{position:relative; padding:28px; overflow:hidden; background:linear-gradient(135deg, #0d2634, #0a1520 60%); border:1px solid var(--border-hi);}
.balance-card::before{content:''; position:absolute; width:280px; height:280px; background:radial-gradient(circle,rgba(79,209,255,0.22),transparent 70%); top:-100px; right:-60px;}
.balance-label{color:var(--muted); font-size:13px; margin-bottom:8px;}
.balance-amt{font-family:var(--font-d); font-size:clamp(34px,5vw,46px); font-weight:700; letter-spacing:-1px;}
.balance-sub{display:flex; gap:18px; margin-top:18px; flex-wrap:wrap;}
.balance-sub div{font-size:12.5px; color:var(--muted);}
.balance-sub b{display:block; color:var(--text); font-size:15px; font-family:var(--font-d);}
.mini-stats{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.mini-stat{padding:18px;}
.mini-stat .l{font-size:12px; color:var(--muted);}
.mini-stat .v{font-family:var(--font-d); font-size:21px; margin-top:6px;}
.mini-stat .v.up{color:var(--success);} .mini-stat .v.down{color:var(--danger);}

.qa-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:22px;}
@media(max-width:760px){.qa-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:420px){.qa-grid{grid-template-columns:repeat(2,1fr);}}
.qa{padding:18px 10px; text-align:center; transition:.2s; color:var(--text);}
.qa:hover{border-color:var(--border-hi); transform:translateY(-2px);}
.qa .ic{width:38px;height:38px;border-radius:11px;background:var(--glass); display:grid; place-items:center; margin:0 auto 10px;}
.qa span{font-size:12px; font-weight:600;}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 14px;}
.section-title h3{font-family:var(--font-d); font-size:18px;}

table.tx{width:100%; border-collapse:collapse; font-size:13.5px;}
table.tx th{text-align:left; color:var(--muted2); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; padding:10px 12px; border-bottom:1px solid var(--border);}
table.tx td{padding:12px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle;}
table.tx tr:hover td{background:rgba(255,255,255,0.02);}
.amt-in{color:var(--success); font-weight:600;} .amt-out{color:var(--danger); font-weight:600;} .amt-mid{color:var(--accent); font-weight:600;}
.tx-desc{display:flex; align-items:center; gap:10px;}
.tx-ic{width:32px;height:32px;border-radius:9px; display:grid; place-items:center; flex-shrink:0; background:var(--glass); font-size:15px;}
.tx-filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.tx-filters input, .tx-filters select{padding:9px 12px; border-radius:10px; background:var(--glass); border:1px solid var(--border); color:var(--text); font-size:13px;}

/* preset amount chips */
.chip-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.chip{padding:10px 18px; border-radius:12px; background:var(--glass); border:1px solid var(--border); font-size:14px; font-weight:600; transition:.15s; color:var(--text);}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#00131a; border-color:transparent;}
.big-amt-input{font-family:var(--font-d); font-size:38px; text-align:center; background:none; border:none; color:var(--text); width:100%; outline:none;}
.big-amt-wrap{text-align:center; padding:20px 0 6px;}
.big-amt-wrap .cur{color:var(--muted); font-size:20px; vertical-align:top;}

.review-row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px;}
.review-row:last-child{border-bottom:none; font-weight:700; font-size:16px; padding-top:14px;}
.review-row span:first-child{color:var(--muted);}

.success-anim{text-align:center; padding:20px 0;}
.check-circle{width:76px; height:76px; border-radius:50%; background:rgba(56,230,168,0.1); border:2px solid var(--success); display:grid; place-items:center; margin:0 auto 18px; animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(0.5); opacity:0;} 100%{transform:scale(1); opacity:1;}}
.check-circle svg{width:34px; height:34px;}

.qr-box{width:200px; height:200px; margin:0 auto 18px; border-radius:16px; background:#fff; padding:12px;}
.qr-box canvas{width:100%; height:100%;}

.sec-list{display:grid; gap:10px;}
.sec-row{display:flex; align-items:center; justify-content:space-between; padding:16px; }
.sec-row .l{display:flex; align-items:center; gap:12px;}
.sec-ic{width:38px;height:38px;border-radius:10px; background:var(--glass); display:grid; place-items:center;}

.toast-wrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:10px; max-width:320px;}
.toast{padding:14px 16px; border-radius:12px; font-size:13.5px; animation:slidein .25s ease; box-shadow:0 10px 30px rgba(0,0,0,0.4);}
@keyframes slidein{from{transform:translateX(30px); opacity:0;} to{transform:translateX(0); opacity:1;}}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(4,6,10,0.72); backdrop-filter:blur(6px); z-index:150; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{width:100%; max-width:420px; padding:30px; max-height:90vh; overflow:auto;}

/* emergency mode */
.emergency-screen{position:fixed; inset:0; z-index:300; background:linear-gradient(160deg,#1a0810,#080b11 55%); display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto;}
.emg-card{width:100%; max-width:480px; padding:32px; border:1px solid rgba(255,92,122,0.4); background:rgba(20,8,12,0.7);}
.emg-title{font-family:var(--font-d); font-size:22px; color:var(--danger); text-align:center; margin-bottom:4px; animation:blinktext 1s infinite;}
@keyframes blinktext{50%{opacity:.55;}}
.emg-sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:20px;}
.emg-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; font-size:13.5px; border-bottom:1px solid rgba(255,255,255,0.06);}
.emg-actions{display:grid; gap:9px; margin:18px 0;}
.emg-action{display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-radius:10px; background:rgba(255,255,255,0.03); font-size:13px;}

/* senior mode overrides */
[data-senior="1"] body, body[data-senior="1"]{font-size:calc(1em * var(--scale, 1));}
[data-senior="1"] .btn{padding:15px 26px; font-size:17px;}
[data-senior="1"] .field input, [data-senior="1"] .field select{padding:15px 16px; font-size:17px;}
[data-senior="1"] .field label{font-size:14.5px;}
[data-senior="1"] .balance-amt{font-size:clamp(40px,6vw,54px);}
[data-senior="1"] .qa span{font-size:14px;}
[data-senior="1"] table.tx{font-size:15.5px;}
[data-senior="1"] .section-head p, [data-senior="1"] .lede{font-size:17.5px;}

.senior-banner{background:linear-gradient(90deg,rgba(79,209,255,0.12),rgba(56,230,196,0.06)); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:13.5px; display:flex; align-items:center; gap:10px; margin-bottom:18px;}

.kv-list{display:grid; gap:0;}
.kv{display:flex; justify-content:space-between; padding:13px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px;}
.kv span:first-child{color:var(--muted);}

.reduced-motion *{animation-duration:0.001s !important; transition-duration:0.001s !important;}
.skip-link{position:absolute; left:-999px; top:0; background:var(--accent); color:#00131a; padding:10px 16px; z-index:999;}
.skip-link:focus{left:10px; top:10px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>
<a href="#dashboard" class="skip-link">Skip to content</a>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ICASH — cardless face-authenticated demo fintech app
   Everything here is simulated / demo data. No real biometric
   matching, banking, or emergency-service contact takes place.
========================================================= */

/* ---------- STATE ---------- */
const DEFAULT_TX = [
  {id:'TXN-9F21A', date:'2026-09-20', desc:'Salary Credit', type:'in', amount:5000, status:'Completed'},
  {id:'TXN-8C10B', date:'2026-09-19', desc:'Grocery Store', type:'out', cat:'Food', amount:1200, status:'Completed'},
  {id:'TXN-7A02D', date:'2026-09-18', desc:'ATM Withdrawal', type:'out', cat:'Cash', amount:2000, status:'Completed'},

    if(m < 0 || (m===0 && t.getDate() < d.getDate())) age--;
    return age;

    localStorage.setItem('icash_balance', String(this.balance));

/* ---------- ROUTER ---------- */
const routes = {};
function route(name, fn){ routes[name] = fn; }
function nav(name){ location.hash = '#'+name; }
function currentRoute(){ return (location.hash || '#landing').slice(1).split('?')[0]; }
window.addEventListener('hashchange', render);
function requireAuth(){
  if(!State.session || !State.session.active){ nav('login'); return false; }
  return true;
}
function render(){
  const r = currentRoute();
  const fn = routes[r] || routes['landing'];
  document.getElementById('app').innerHTML = '';
  document.body.setAttribute('data-senior', State.user && State.user.seniorMode ? '1':'0');
  fn();
  window.scrollTo(0,0);
}

function fmtINR(n){ return '₹' + Number(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function mount(node){ document.getElementById('app').appendChild(node); }
function toast(msg, kind){
  kind = kind || 'ok';
  const colors = {ok:'rgba(56,230,168,0.12)', warn:'rgba(242,184,75,0.14)', danger:'rgba(255,92,122,0.14)'};
  const borders = {ok:'rgba(56,230,168,0.4)', warn:'rgba(242,184,75,0.4)', danger:'rgba(255,92,122,0.4)'};
  const t = el(`<div class="toast glass" style="background:${colors[kind]}; border-color:${borders[kind]}">${msg}</div>`);
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 3200);
}

/* ---------- NAV BAR ---------- */
function navbar(){
  const loggedIn = State.session && State.session.active;
  const active = currentRoute();
  const links = loggedIn
    ? [['dashboard','Dashboard'],['withdraw','Withdraw'],['send','Send Money'],['history','Transactions'],['analytics','Analytics'],['security','Security'],['profile','Profile']]
    : [['landing','Home'],['landing-features','Features'],['landing-security','Security'],['login','Login'],['register','Register']];
  const linkHtml = links.map(([r,label])=>{
    if(r.startsWith('landing-')) return `<a href="#landing" onclick="setTimeout(()=>document.getElementById('${r.split('-')[1]}')?.scrollIntoView({behavior:'smooth'}),50)">${label}</a>`;
    return `<a href="#${r}" class="${active===r?'active':''}">${label}</a>`;
  }).join('');
  const bar = el(`
  <div class="topnav">
    <div class="wrap row">
      <a href="#${loggedIn?'dashboard':'landing'}" class="brand"><span class="mark"></span>iCash</a>
      <div class="navlinks">${linkHtml}</div>
      <div class="navcta">
        ${loggedIn
          ? `<button class="btn btn-ghost btn-sm" id="atmBtn">ATM</button><button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>`
          : `<button class="btn btn-ghost btn-sm" onclick="nav('login')">Login</button><button class="btn btn-primary btn-sm" onclick="nav('register')">Get Started</button>`}
      </div>
      <button class="hamb" id="hambBtn">☰</button>
    </div>
  </div>`);
  mount(bar);
  if(loggedIn){
    bar.querySelector('#logoutBtn').onclick = ()=>{ State.session={active:false}; State.save(); toast('Logged out'); nav('landing'); };
    bar.querySelector('#atmBtn').onclick = ()=> nav('atm');
  }
  bar.querySelector('#hambBtn').onclick = ()=>{
    const existing = links.map(([r,label])=>`<a href="#${r.startsWith('landing-')?'landing':r}" style="display:block;padding:12px 0;border-bottom:1px solid var(--border)">${label}</a>`).join('');
    openModal(`<div class="auth-head"><h2>Menu</h2></div>${existing}`);
  };
}

}

      bx[i] = q[i * 3] / 8000;
      by[i] = q[i * 3 + 1] / 8000;
      bz[i] = q[i * 3 + 2] / 8000;
    }
  })();

  const sx = new Float32Array(N), sy = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N), vz = new Float32Array(N);
  const stars = Array.from({length: 60}, ()=>({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.3, p: Math.random() * 6.28 }));

  /* ---------- pointer interaction ---------- */
  let ang = 0.7, drag = false, lx = 0;
  cv.style.cursor = 'grab';
  cv.style.touchAction = 'none';
  cv.addEventListener('pointerdown', e => {
    drag = true; lx = e.clientX;
    cv.style.cursor = 'grabbing';
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if(drag){ ang += (e.clientX - lx) * 0.012; lx = e.clientX; }
  });
  const stopDrag = () => { drag = false; cv.style.cursor = 'grab'; };
  ['pointerup','pointercancel','pointerleave'].forEach(ev => cv.addEventListener(ev, stopDrag));

  /* ---------- render loop ---------- */
  let last = performance.now();
  let rafId = null;

  function frame(t){
    if(!cv.isConnected){
      window.removeEventListener('resize', resize);
      return;
    }
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if(!drag) ang += 0.5 * dt;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#070d14';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H * 0.48, R = W * 0.28, u = R * 0.38;

    // Background starfield
    for(const s of stars){
      ctx.globalAlpha = 0.3 + 0.35 * Math.sin(t * 0.001 + s.p);
      ctx.fillStyle = '#3ab4e0';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Outer subtle perspective ring
    ctx.strokeStyle = 'rgba(60, 130, 160, 0.3)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, R * (0.1 + 0.2 * Math.abs(Math.cos(ang * 0.5))), R * 1.18, 0, 0, 6.283);
    ctx.stroke();

    // Orbital ring back half
    const ox = R * 0.89, oy = R * 0.15, oc = cy - R * 0.42, orb = Math.max(1.5, R * 0.014);
    ctx.strokeStyle = '#2a9d8a';
    ctx.lineWidth = orb;
    ctx.beginPath();
    ctx.ellipse(cx, oc, ox, oy, 0, Math.PI, Math.PI * 2);
    ctx.stroke();

    // Transform 3D mesh vertices
    const c = Math.cos(ang), s = Math.sin(ang), F = 6, pc = Math.cos(0.12), ps = Math.sin(0.12);
    for(let i = 0; i < N; i++){
      const xr = bx[i] * c + bz[i] * s, zr = -bx[i] * s + bz[i] * c;
      const y2 = by[i] * pc - zr * ps, z2 = by[i] * ps + zr * pc, k = F / (F - z2);
      vx[i] = xr; vy[i] = y2; vz[i] = z2;
      sx[i] = cx + xr * u * k; sy[i] = cy - (y2 + 0.75) * u * k;
    }

    const scan = Y1 + (Y0 - Y1) * (0.5 + 0.5 * Math.sin(t * 0.0009));
    const lw = Math.max(0.5, W / 800);
    ctx.globalCompositeOperation = 'lighter';
    const back = new Path2D();

    for(let r = 0; r < ROWS; r++){
      const yq = (by[r * COLS] + by[(r + 1) * COLS]) / 2, near = Math.max(0, 1 - Math.abs(yq - scan) / 0.22);
      for(let q = 0; q < COLS; q++){
        const i0 = r * COLS + q, i1 = r * COLS + (q + 1) % COLS, i2 = (r + 1) * COLS + (q + 1) % COLS, i3 = (r + 1) * COLS + q;
        const cr = (sx[i1] - sx[i0]) * (sy[i3] - sy[i0]) - (sy[i1] - sy[i0]) * (sx[i3] - sx[i0]);
        if(cr <= 0){
          back.moveTo(sx[i0], sy[i0]); back.lineTo(sx[i1], sy[i1]); back.lineTo(sx[i2], sy[i2]); back.lineTo(sx[i3], sy[i3]); back.closePath();
          continue;
        }
        const ax = vx[i1] - vx[i0], ay = vy[i1] - vy[i0], az = vz[i1] - vz[i0],
              bx_ = vx[i3] - vx[i0], by_ = vy[i3] - vy[i0], bz_ = vz[i3] - vz[i0];
        const nx = ay * bz_ - az * by_, ny = az * bx_ - ax * bz_, nz = ax * by_ - ay * bx_;
        const rim = 1 - Math.abs(nz) / Math.sqrt(nx * nx + ny * ny + nz * nz + 1e-9);
        const rr = rim * rim, lit = Math.max(0, -(nx * 0.45 + ny * 0.6 + nz * 0.66)) / Math.sqrt(nx * nx + ny * ny + nz * nz + 1e-9);
        ctx.fillStyle = 'rgba(20,80,210,' + (0.04 + 0.28 * rr + 0.22 * lit * lit + near * 0.12).toFixed(3) + ')';
        ctx.strokeStyle = 'rgba(' + Math.round(50 + 140 * rim + near * 60) + ',' + Math.round(140 + 100 * rim + 60 * lit + near * 60) + ',255,' + Math.min(1, 0.28 + 0.6 * rim + 0.3 * lit + near * 0.5).toFixed(2) + ')';
        ctx.lineWidth = lw * (1 + near * 0.8);
        ctx.beginPath(); ctx.moveTo(sx[i0], sy[i0]); ctx.lineTo(sx[i1], sy[i1]); ctx.lineTo(sx[i2], sy[i2]); ctx.lineTo(sx[i3], sy[i3]); ctx.closePath();
        ctx.fill(); ctx.stroke();
      }
    }
    ctx.strokeStyle = 'rgba(40,100,220,0.13)';
    ctx.lineWidth = lw * 0.8;
    ctx.stroke(back);
    ctx.globalCompositeOperation = 'source-over';

    // Holographic laser scan line
    const sY = cy - (scan + 0.75) * u;
    const sg = ctx.createLinearGradient(cx - R * 0.9, 0, cx + R * 0.9, 0);
    sg.addColorStop(0, 'rgba(90,220,255,0)');
    sg.addColorStop(0.5, 'rgba(90,220,255,0.5)');
    sg.addColorStop(1, 'rgba(90,220,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(cx - R * 0.9, sY - 0.5, R * 1.8, 1);

    // Orbital ring front half + travelling glowing node
    ctx.strokeStyle = '#2a9d8a';
    ctx.lineWidth = orb;
    ctx.beginPath();
    ctx.ellipse(cx, oc, ox, oy, 0, 0, Math.PI);
    ctx.stroke();

    const oa = t * 0.0013;
    ctx.fillStyle = '#7ff3d6';
    ctx.shadowColor = '#2ad9b0';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(cx + ox * Math.cos(oa), oc + oy * Math.sin(oa), 3, 0, 6.283);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Glowing cyan boundary ring
    ctx.strokeStyle = '#3ab4e0';
    ctx.lineWidth = Math.max(2, R * 0.025);
    ctx.shadowColor = '#3ab4e0';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 6.283);
    ctx.stroke();
    ctx.shadowBlur = 0;

    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);
}

    <div class="wizard-footer"><button class="btn btn-ghost" id="back3">Back</button><button class="btn btn-primary" id="next3">Continue</button></div>`;
  if(step===3){
    document.getElementById('back3').onclick=()=>{RegState.step=2; renderWizardStep();};
    document.getElementById('next3').onclick=()=>{
      const n=val('rEcName'), p=val('rEcPhone'), r=val('rEcRel');
      if(!n||!p){ toast('Add your emergency contact details','warn'); return; }

      RegState.step=4; renderWizardStep();

  if(step===4) box.innerHTML = `
    <div class="auth-head"><h2>Secure face registration</h2><p>Step 4 of 4 — liveness verification</p></div>

  if(step===4){
    document.getElementById('back4').onclick=()=>{RegState.step=3; renderWizardStep();};
    mountFaceScanner(document.getElementById('faceRegHolder'), {

          dob:RegState.dob, age:RegState.age, senior:RegState.senior,

        toast('Face identity registered ✓','ok');
        setTimeout(()=>{
          State.session = {active:true, method:'register'};
          State.save();
          nav('dashboard');
        }, 900);
      }
    });
  }
}

/* =========================================================
   REUSABLE FACE / LIVENESS SCANNER
   Real webcam feed; liveness sequence is a clearly-labelled
   simulation (face-count + timed blink prompts), not true ML.
========================================================= */
function mountFaceScanner(container, opts){
  opts = opts||{};
  const senior = opts.senior || (State.user && State.user.seniorMode);
  container.innerHTML = `
    <div class="scanner ${senior?'senior':''}" id="scnBox">
      <video id="scnVideo" autoplay playsinline muted></video>
      <div class="ring" id="scnRing" style="display:none;"></div>
      <div class="frame"></div>
      <div class="eye-track" id="scnEyeTrack" style="display:none;">
        <span class="eye-dot left"></span><span class="eye-dot right"></span>
      </div>
      <div class="flash" id="scnFlash"></div>
    </div>
    <div class="scan-status" id="scnStatus">Starting camera…</div>
    <div class="scan-checks" id="scnChecks">
      <div class="scan-check" data-k="face"><div class="dot"></div> Face detected</div>
      <div class="scan-check" data-k="single"><div class="dot"></div> One person detected</div>
      <div class="scan-check" data-k="look"><div class="dot"></div> Looking at camera</div>
      <div class="scan-check" data-k="blink1"><div class="dot"></div> Blink 1</div>
      <div class="scan-check" data-k="blink2"><div class="dot"></div> Blink 2</div>
      <div class="scan-check" data-k="live"><div class="dot"></div> Liveness verified</div>
    </div>
    <div class="demo-tag" id="scnMotionTag" style="margin-bottom:10px;">Eye tracking idle</div>
    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" id="simMultiBtn">Simulate multiple faces</button>
      <button class="btn btn-outline btn-sm" id="restartBtn" style="display:none;">Restart camera</button>
    </div>`;
  const statusEl = container.querySelector('#scnStatus');
  const eyeTag = container.querySelector('#scnMotionTag');
  const eyeTrackBox = container.querySelector('#scnEyeTrack');
  const checks = {};
  container.querySelectorAll('.scan-check').forEach(c=> checks[c.dataset.k]=c);
  const setCheck = k=>{ checks[k].classList.add('on'); checks[k].querySelector('.dot').innerHTML = iconSvg('check').replace('width="20" height="20"','width="10" height="10"'); };
  const flash = container.querySelector('#scnFlash');
  const ring = container.querySelector('#scnRing');
  const video = container.querySelector('#scnVideo');
  const restartBtn = container.querySelector('#restartBtn');
  const simMultiBtn = container.querySelector('#simMultiBtn');
  let stream, cancelled=false;

  /* ---- real eye-region tracking from the live video feed ----
     Rather than diffing the whole frame, we crop a horizontal band
     across the eye area (positioned to match the on-screen guide
     dots) and measure its local contrast/texture on every sampled
     frame. Open eyes — iris, sclera, lashes — read as high-contrast;
     a closed eyelid reads as smooth, low-contrast skin. We track that
     contrast score over time and require a genuine OPEN → CLOSED →
     OPEN dip for each blink. A static photo never produces that
     transition, so it cannot pass. This is a simplified on-device
     signal, not full facial-landmark ML. */
  const eCanvas = document.createElement('canvas'); eCanvas.width=64; eCanvas.height=18;
  const eCtx = eCanvas.getContext('2d', {willReadFrequently:true});
  let eyeScores=[], eyeTimer=null, eyeState='idle'; // idle | open | dipping

  function sampleEyeBand(){
    if(!video.videoWidth) return null;
    const vw=video.videoWidth, vh=video.videoHeight;
    // eye band: horizontal strip roughly where the eye-track guide sits
    const sx = vw*0.20, sy = vh*0.30, sw = vw*0.60, sh = vh*0.14;
    eCtx.drawImage(video, sx, sy, sw, sh, 0, 0, 64, 18);
    const data = eCtx.getImageData(0,0,64,18).data;
    let sum=0, sumSq=0, n=0;
    for(let i=0;i<data.length;i+=4){
      const lum = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
      sum += lum; sumSq += lum*lum; n++;
    }
    const mean = sum/n;
    const variance = (sumSq/n) - (mean*mean);
    return Math.sqrt(Math.max(variance,0)); // contrast (std-dev of luminance)
  }
  function startEyeTracking(){
    eyeScores=[]; eyeState='idle';
    eyeTimer = setInterval(()=>{
      try{
        const score = sampleEyeBand();
        if(score==null) return;
        eyeScores.push(score);
        if(eyeScores.length>50) eyeScores.shift();
        const base = recentBaseline();
        const isOpen = score > base*0.72;
        eyeTag.textContent = 'Eyes: ' + (eyeScores.length<6 ? 'calibrating…' : (isOpen?'OPEN':'CLOSED'));
        eyeTag.style.color = eyeScores.length<6 ? '' : (isOpen ? 'var(--success)' : 'var(--warn)');
      }catch(e){ /* frame not ready */ }
    }, 90);
  }
  function stopEyeTracking(){ clearInterval(eyeTimer); eyeTimer=null; }
  function recentBaseline(){
    // running "eyes open" reference = recent local maximum contrast
    const s = eyeScores.slice(-25);
    return s.length ? Math.max(...s) : 0;
  }

  function fail(msg){
    statusEl.textContent = msg; statusEl.style.color='var(--danger)';
    ring.style.display='none'; eyeTrackBox.style.display='none';
    restartBtn.style.display='inline-flex';
    simMultiBtn.style.display='none';
    stopEyeTracking();
  }
  function startCamera(){
    cancelled=false; statusEl.style.color='var(--accent)';
    restartBtn.style.display='none'; simMultiBtn.style.display='inline-flex';
    eyeTag.style.display='block'; eyeTag.textContent='Eye tracking idle'; eyeTag.style.color='';
    Object.values(checks).forEach(c=>{c.classList.remove('on'); c.querySelector('.dot').innerHTML='';});
    statusEl.textContent = 'Starting camera…';
    navigator.mediaDevices?.getUserMedia?.({video:{facingMode:'user'}, audio:false}).then(s=>{
      if(cancelled) return;
      stream = s; video.srcObject = s; ring.style.display='block';
      startEyeTracking();
      runSequence();
    }).catch(()=>{
      fail('Camera access is required for face authentication.');
    });
  }
  function runSequence(){
    statusEl.textContent = 'Scanning for a face…';
    step(1100, ()=>{
      setCheck('face'); statusEl.textContent = 'One face detected';
      eyeTrackBox.style.display='block';
      step(700, ()=>{
        setCheck('single'); statusEl.textContent = 'Please look directly at the camera';
        step(1200, ()=>{
          setCheck('look');
          waitForBlink(1, ()=>{
            setCheck('blink1'); flashOnce();
            step(500, ()=>{
              waitForBlink(2, ()=>{
                setCheck('blink2'); flashOnce();
                statusEl.textContent = '✓ Liveness verified';
                step(600, ()=>{
                  setCheck('live'); statusEl.textContent = opts.mode==='register' ? 'Face identity registered' : 'ACCESS GRANTED';
                  stopStream();
                  if(opts.onSuccess) opts.onSuccess();
                });
              });
            });
          });
        });
      });
    });
  }
  // Watches the eye band for a genuine OPEN -> CLOSED -> OPEN transition.
  // A held-up static photo has no eyelid to close, so contrast never
  // dips and this times out instead of silently passing.
  function waitForBlink(n, onDetected){
    statusEl.textContent = `Blink now — blink ${n} of 2`;
    let sawClose = false, closeTime = 0;
    const deadline = Date.now() + 7000;
    const poll = setInterval(()=>{
      if(cancelled){ clearInterval(poll); return; }
      const score = eyeScores[eyeScores.length-1];
      const base = recentBaseline();
      if(score!=null && base>0){
        const closed = score < base*0.62;
        const open = score > base*0.82;
        if(!sawClose && closed){ sawClose = true; closeTime = Date.now(); }
        else if(sawClose && open && Date.now()-closeTime < 1600){
          clearInterval(poll);
          onDetected();
          return;
        } else if(sawClose && Date.now()-closeTime > 1600){
          sawClose = false; // stale dip — likely occlusion/look-away, reset and keep watching
        }
      }
      if(Date.now() > deadline){
        clearInterval(poll);
        fail("No live blink detected. A photo can't close its eyes — please use a live camera, look at the frame, and blink clearly, then restart.");
      }
    }, 110);
  }
  function step(ms, fn){ const id = setTimeout(()=>{ if(!cancelled) fn(); }, ms); return id; }
  function flashOnce(){ flash.classList.add('on'); setTimeout(()=>flash.classList.remove('on'), 180); }
  function stopStream(){ stream?.getTracks()?.forEach(t=>t.stop()); stopEyeTracking(); }

  simMultiBtn.onclick = ()=>{
    cancelled = true; stopStream();
    fail('Multiple faces detected. For your security, face scanning has been stopped. Please restart the camera with only one person visible.');
    State.logEvent('Security alert', 'Multiple faces detected during scan — scanning stopped');
  };
  restartBtn.onclick = ()=> startCamera();
  startCamera();

  // cleanup when this container leaves the DOM
  const obs = new MutationObserver(()=>{ if(!container.isConnected){ cancelled=true; stopStream(); obs.disconnect(); } });
  obs.observe(document.getElementById('app'), {childList:true, subtree:true});
}

function drawFakeQR(canvas, seed){
  const ctx = canvas.getContext('2d');
  const size = 21; const cell = canvas.width/size;
  // deterministic pseudo-random pattern from seed string
  let h = 0; for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  function rnd(){ h = (h*1664525 + 1013904223) >>> 0; return h/4294967296; }
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#0a0e16';
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const inFinder = (x<7&&y<7)||(x>size-8&&y<7)||(x<7&&y>size-8);
    if(inFinder) continue;
    if(rnd()>0.55) ctx.fillRect(x*cell, y*cell, cell, cell);
  }
  // finder patterns
  [[0,0],[size-7,0],[0,size-7]].forEach(([fx,fy])=>{
    ctx.fillStyle='#0a0e16'; ctx.fillRect(fx*cell,fy*cell,7*cell,7*cell);
    ctx.fillStyle='#fff'; ctx.fillRect((fx+1)*cell,(fy+1)*cell,5*cell,5*cell);
    ctx.fillStyle='#0a0e16'; ctx.fillRect((fx+2)*cell,(fy+2)*cell,3*cell,3*cell);
  });
}

      <div class="card mini-stat"><div class="l">Remaining budget</div><div class="v up">${fmtINR(Math.max(0,budget-total))}</div></div>
    </div>
    <div class="glass" style="padding:18px;">${iconSvg('shield')} <b>Insight:</b> Your highest spending category this month is <b>${topCat?topCat[0]:'—'}</b>, at ${fmtINR(topCat?topCat[1]:0)}.</div>
  </div></div>`);
  mount(shell);
  if(typeof Chart==='undefined') return;
  const labels = Object.keys(byCat), data = Object.values(byCat);
  const colors = ['#4fd1ff','#38e6c4','#f2b84b','#ff5c7a','#9d7bff','#5f7590'];
  new Chart(document.getElementById('donutChart'), {
    type:'doughnut',
    data:{labels, datasets:[{data, backgroundColor:colors, borderWidth:0}]},
    options:{plugins:{legend:{position:'bottom', labels:{color:'#8ea3bd', font:{family:'Inter'}}}}, cutout:'68%'}
  });
  new Chart(document.getElementById('barChart'), {
    type:'bar',
    data:{labels, datasets:[{label:'Spend', data, backgroundColor:'#4fd1ff88', borderRadius:6}]},
    options:{plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#8ea3bd'}, grid:{display:false}}, y:{ticks:{color:'#8ea3bd'}, grid:{color:'rgba(255,255,255,0.05)'}}}}
  });
});

    <div class="dash-grid">
      <div class="card">
        <div class="sec-list">
          <div class="sec-row"><div class="l"><div class="sec-ic">${iconSvg('face')}</div>Face Authentication</div><span class="pill ok">Active</span></div>
          <div class="sec-row"><div class="l"><div class="sec-ic">${iconSvg('shield')}</div>Liveness Detection</div><span class="pill ok">Enabled</span></div>
          <div class="sec-row"><div class="l"><div class="sec-ic">${iconSvg('alert')}</div>Emergency PIN</div><span class="pill ok">Configured</span></div>
          <div class="sec-row"><div class="l"><div class="sec-ic">${iconSvg('contact')}</div>Emergency Contact</div><span class="pill ok">Verified — ${State.user.emergencyContact?.name||'—'}</span></div>
          <div class="sec-row"><div class="l"><div class="sec-ic">${iconSvg('history')}</div>Last Login</div><span class="pill">${State.user.lastLogin}</span></div>
          <div class="sec-row"><div class="l"><div class="sec-ic">${iconSvg('shield')}</div>Security Events</div><span class="pill warn">${State.events.length} recent</span></div>
        </div>
      </div>
      <div class="card" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;">
        <div style="width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(79,209,255,.18),transparent 70%); display:grid; place-items:center; color:var(--accent);">${iconSvg('shield').replace('width="20" height="20"','width="46" height="46"')}</div>
        <div style="font-family:var(--font-d); font-size:15px;">Protected by iCash Security</div>
        <div style="color:var(--muted); font-size:12.5px; text-align:center;">Single-face detection · liveness check · biometric auth · emergency controls</div>
      </div>
    </div>
    <div class="section-title"><h3>Recent security events</h3></div>
    <div class="card" id="secEvents"></div>
  </div></div>`);
  mount(shell);
  const evHolder = document.getElementById('secEvents');
  if(!State.events.length){ evHolder.innerHTML = `<div style="padding:20px; color:var(--muted); text-align:center;">No security events yet.</div>`; }
  else evHolder.innerHTML = State.events.map(e=>`<div class="kv"><span>${e.type} — ${e.desc}</span><span>${e.time}</span></div>`).join('');
});

      <div class="card">
        <div class="kv-list">

          <div class="kv"><span>Email</span><span>${u.email}</span></div>
          <div class="kv"><span>Date of birth</span><span>${u.dob}</span></div>
          <div class="kv"><span>Age</span><span>${u.age}</span></div>
          <div class="kv"><span>User type</span><span>${u.senior?'Senior Citizen / Elderly':'Standard'}</span></div>
          <div class="kv"><span>Aadhaar</span><span>${maskAadhaar(u.aadhaar)}</span></div>
          <div class="kv"><span>Face authentication</span><span class="pill ok">Registered</span></div>
        </div>
      </div>
      <div class="card">
        <h4 style="font-family:var(--font-d); margin-bottom:14px;">Emergency contact</h4>
        <div class="kv-list">
          <div class="kv"><span>Name</span><span>${u.emergencyContact?.name||'—'}</span></div>
          <div class="kv"><span>Phone</span><span>${u.emergencyContact?.phone||'—'}</span></div>
          <div class="kv"><span>Relationship</span><span>${u.emergencyContact?.relation||'—'}</span></div>
        </div>
        <h4 style="font-family:var(--font-d); margin:20px 0 10px;">Accessibility</h4>
        <div class="sec-row" style="padding:0;"><div class="l">Senior Citizen Mode</div>
          <label style="position:relative; display:inline-flex; align-items:center; cursor:pointer;">

          </label>
        </div>
        <p style="color:var(--muted2); font-size:12px; margin-top:8px;">Larger text, simplified layout, and extra transaction confirmations. This is an accessibility setting, not a medical classification.</p>

    render();
  };
});
